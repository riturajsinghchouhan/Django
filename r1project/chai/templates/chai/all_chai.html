{% extends "layout.html" %}

{% block title %}
App Chai page
{% endblock title %}


{% block content %}

<h1>All chai avalable </h1>
<div class="grid grid-cols-3 gap-4 m-4">
    {% for chai in chais   %}
        <div class="bg-blue-800 p-5 rounded">
            <div class="chai-item">
            <img class="rounded shadow-lg" src="{{chai.image.url}}" alt="">
            <h3>{{chai.name}}</h3>
            <a href="{% url 'chai_detail' chai.id %}">
                <button
                type="button"
                class="inline-flex items-center w-[100%] justify-center px-4
                py-2 border border-transparent text-sm font-medium rounded-b-md
                text-white bg-orange-600 hover:bg-amber-200 focus:outline-none  focus:right-2 focus:ring-offset-2
                focus:ring-orange-500"
                >
                    {{chai.type}} - {{chai.id}}
                </button>   
            </a>
        </div>
        </div>
        
    {% endfor %}
</div>



{% endblock %}
